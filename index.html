<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Gallery Launch</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Container for everything */
        #ar-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #111;
        }

        /* The clickable "Enter" button */
        #custom-ar-button {
            background-color: #007AFF;
            border-radius: 50px;
            padding: 18px 40px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 20px;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999; /* Ensures it sits on top of the image */
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: block;
        }

        /* Optional: Highlighting the button when tapped */
        #custom-ar-button:active {
            background-color: #0056b3;
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>

    <div id="ar-container">
        <!-- The 3D Component -->
        <model-viewer 
            id="gallery-model"
            src="room33.glb" 
            ios-src="room33.usdz"
            poster="screenstate.png"
            loading="eager"
            ar 
            ar-modes="scene-viewer quick-look webxr" 
            ar-placement="floor"
            camera-controls
            alt="Stuart Nielsen gallery">
            
            <!-- We use a standard button here instead of the 'slot' version -->
            <button id="custom-ar-button">
                ENTER GALLERY
            </button>

        </model-viewer>
    </div>

    <script>
        const modelViewer = document.querySelector('#gallery-model');
        const arButton = document.querySelector('#custom-ar-button');

        // Logic 1: When the button is clicked, launch AR
        arButton.addEventListener('click', () => {
            modelViewer.activateAR();
        });

        // Logic 2: (Optional) Make the whole splash image clickable too
        modelViewer.addEventListener('click', (event) => {
            // Only trigger if they didn't click the button itself (to avoid double trigger)
            if (event.target !== arButton) {
                modelViewer.activateAR();
            }
        });
    </script>

</body>
</html>
