<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery AR Launch</title>
    
    <!-- Load model-viewer script in the head -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #111; 
            color: white; 
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
        }

        /* The container for the 3D preview */
        model-viewer {
            width: 100%;
            height: 400px;
            background-color: #222;
            border-radius: 15px;
            margin-bottom: 20px;
            --poster-color: transparent;
        }

        /* AR Button Styling */
        .ar-button { 
            display: inline-block;
            padding: 16px 32px; 
            font-size: 16px; 
            background: #007AFF; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .ar-button:active {
            transform: scale(0.95);
            background: #005ec5;
        }

        p { margin-bottom: 20px; opacity: 0.8; line-height: 1.5; }
        h2 { margin-bottom: 10px; }

        /* Hide the default AR button so we can use our custom one */
        #ar-button-custom {
            position: absolute;
            bottom: 16px;
            right: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gallery AR Launch</h2>
        <p>Preview the gallery below. Tap the button to place the room in your actual space.</p>

        <!-- 3D Viewer -->
        <model-viewer 
            src="room33.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor"
            camera-controls 
            touch-action="pan-y"
            shadow-intensity="1"
            alt="Stuart Nielsen gallery">
            
            <!-- Custom AR Launch Button (visible on mobile) -->
            <button slot="ar-button" class="ar-button" id="ar-button-custom">
                ENTER GALLERY
            </button>

            <!-- Loading Slot -->
            <div slot="poster" style="color: #666; padding-top: 180px;">Loading 3D Gallery...</div>
        </model-viewer>

        <!-- Optional: Manual Android Intent Link (Only if needed) -->
        <a class="ar-button" 
           href="intent://tallbridgeguy-ar.github.io/Art/room33.glb#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;">
           FORCE ANDROID AR
        </a>
    </div>

</body>
</html>
