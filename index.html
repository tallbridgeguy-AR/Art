<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Gallery</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrolling on the splash page */
            background-color: #000;
        }

        /* Full Screen Splash Screen */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #111;
            --poster-color: transparent;
        }

        /* Custom Button Styling */
        #ar-button {
            background-color: #007AFF;
            border-radius: 50px; /* Rounded pill shape */
            padding: 16px 32px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 20px;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* This hides the button if the device can't do AR */
        model-viewer:not(.ar-visible) #ar-button {
            display: block; 
        }
    </style>
</head>
<body>

    <model-viewer 
        src="room33.glb" 
        ios-src="room33.usdz"
        poster="screenstate.png"
        loading="eager"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        ar-placement="floor"
        camera-controls
        touch-action="pan-y"
        alt="Stuart Nielsen gallery">
        
        <!-- The Single Universal Button -->
        <button slot="ar-button" id="ar-button">
            ENTER GALLERY
        </button>

    </model-viewer>

</body>
</html>
