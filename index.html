<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #111; 
            color: white; 
        }

        /* The container for the 3D preview & Splash Screen */
        model-viewer {
            width: 90vw; 
            max-width: 600px;
            height: 400px;
            background-color: #222;
            border-radius: 15px;
            --poster-color: transparent;
        }

        .ar-button { 
            background-color: #007AFF;
            border-radius: 12px;
            padding: 15px 25px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 18px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            white-space: nowrap;
        }

        h2 { margin-bottom: 10px; }
        p { opacity: 0.8; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Gallery AR Launch</h2>
    <p>Tap the button below to place the gallery in your room.</p>

    <model-viewer 
        src="room33.glb" 
        ios-src="room33.usdz"
        poster="screenstate.png"
        loading="lazy"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        ar-placement="floor"
        camera-controls 
        shadow-intensity="1"
        alt="Stuart Nielsen gallery">
        
        <!-- This single button works for both Android and iOS -->
        <button slot="ar-button" class="ar-button">
            ENTER GALLERY
        </button>

    </model-viewer>

</body>
</html>
