<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART Phonebook AR Gallery</title>
    
    <!-- The Magic Script for AR -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { margin: 0; background: #111; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* 
         * SPLASH SCREEN (screenstate.png overlay)
         * This container covers the entire viewport initially.
         */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111; /* Match body background */
            background-image: url('screenstate.png'); /* The background image */
            background-size: cover; /* or 'contain' if you prefer the whole image visible */
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100; /* Must be higher than the model-viewer */
            transition: opacity 0.5s ease, visibility 0.5s ease; /* Smooth transition */
        }

        /* Styling for the Proceed/Start Button */
        #start-button {
            background: #007AFF; /* iOS blue style, consistent with earlier design */
            color: white;
            padding: 16px 32px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px; /* Space below any text on screenstate.png */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #start-button:active {
            transform: scale(0.95);
            background: #005ec5;
        }

        /* Class to hide the splash screen via JavaScript */
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* Users can click through it */
        }

        /* 
         * THE AR VIEWER
         * This will be visible *under* the splash screen until start is clicked.
         */
        model-viewer {
            width: 90vw;
            height: 70vh;
            background-color: #222;
            --poster-color: transparent;
            z-index: 1;
        }

        /* This custom launch button is only visible on supported mobile devices */
        #ar-launch-custom {
            background: rgba(255, 255, 255, 0.8);
            color: #111;
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

    </style>
</head>
<body>

    <!-- 
        1. THE SPLASH/START SCREEN
        This div is layered on top of the viewer.
    -->
    <div id="splash-screen">
        <!-- 
           If screenstate.png contains its own title and text, leave this empty.
           If you want to overlay text on screenstate.png, add it here:
           <h2>Welcome to ART Phonebook</h2> 
        -->
        
        <button id="start-button">START AR EXPERIENCE</button>
    </div>


    <!-- 
        2. THE AR/3D VIEWER (Visible once splash is hidden)
    -->
    <model-viewer 
        id="gallery-model"
        src="room33.glb" 
        ios-src="room33.usdz" /* Remember iOS needs .usdz */
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1" 
        ar-placement="floor"
        alt="A 3D model of a gallery">
        
        <!-- Button visible *only* on mobile after 3D loads -->
        <button slot="ar-button" id="ar-launch-custom">
            🚀 ENTER ROOM (AR)
        </button>

    </model-viewer>

    <!-- 3. JAVASCRIPT: THE START LOGIC -->
    <script>
        const splashScreen = document.getElementById('splash-screen');
        const startButton = document.getElementById('start-button');

        // Function to hide the splash screen when the button is clicked
        startButton.addEventListener('click', () => {
            splashScreen.classList.add('hidden');
        });

        // Simple error handling for the 3D model (still good practice)
        const modelViewer = document.querySelector('#gallery-model');
        modelViewer.addEventListener('error', (error) => {
            console.error("Error loading 3D model:", error);
            // We still need to hide the splash if the model fails, so the page isn't stuck.
            splashScreen.classList.add('hidden');
            alert("Model could not load. Ensure HTTPS, CORS, and files (glb/usdz) are correct.");
        });
    </script>
</body>
</html>
